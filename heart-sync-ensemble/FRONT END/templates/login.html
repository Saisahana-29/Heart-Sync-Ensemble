{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
    <section class="container mx-auto p-6 max-w-md bg-white rounded-lg shadow-lg mt-12 animate__animated animate__zoomIn">
        <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
        <div id="error-alert" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4" role="alert">
            <p id="error-message"></p>
        </div>
        <form action="{{ url_for('login') }}" method="POST" onsubmit="return validateLoginForm()">
            <div class="mb-4">
                <label for="name" class="block text-gray-700">First Name</label>
                <input type="text" id="name" name="name" class="w-full p-2 border rounded" required>
            </div>
            <div class="mb-4">
                <label for="username" class="block text-gray-700">Last name</label>
                <input type="text" id="username" name="username" class="w-full p-2 border rounded" required>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700">Password</label>
                <input type="password" id="password" name="password" class="w-full p-2 border rounded" required>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 animate__animated animate__pulse animate__infinite">Login</button>
        </form>
        <p class="text-center mt-4">Don't have an account? <a href="{{ url_for('register') }}" class="text-blue-500 hover:underline">Register</a></p>
    </section>
    <script>
        function validateLoginForm() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');

            // Reset error alert
            errorAlert.classList.add('hidden');
            errorMessage.textContent = '';

            // Validation rules
            const usernameRegex = /^[a-zA-Z0-9]{3,20}$/;

            if (!usernameRegex.test(username)) {
                errorMessage.textContent = 'Username must be 3-20 characters long and alphanumeric.';
                errorAlert.classList.remove('hidden');
                return false;
            }
            if (!password) {
                errorMessage.textContent = 'Password cannot be empty.';
                errorAlert.classList.remove('hidden');
                return false;
            }
            return true;
        }
    </script>
{% endblock %}
