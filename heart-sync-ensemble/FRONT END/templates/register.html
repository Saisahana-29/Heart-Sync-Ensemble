{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
    <section class="container mx-auto p-6 max-w-md bg-white rounded-lg shadow-lg mt-12 animate__animated animate__zoomIn">
        <h2 class="text-2xl font-bold text-center mb-6">Register</h2>
        <div id="error-alert" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4" role="alert">
            <p id="error-message"></p>
        </div>
        <form action="{{ url_for('register') }}" method="POST" onsubmit="return validateRegisterForm()">
            <div class="mb-4">
                <label for="name" class="block text-gray-700">First Name</label>
                <input type="text" id="name" name="name" class="w-full p-2 border rounded" required>
            </div>
            <div class="mb-4">
                <label for="username" class="block text-gray-700">Last name</label>
                <input type="text" id="username" name="username" class="w-full p-2 border rounded" required>
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-700">Email</label>
                <input type="email" id="email" name="email" class="w-full p-2 border rounded" required>
            </div>
        
            <div class="mb-4">
                <label for="password" class="block text-gray-700">Password</label>
                <input type="password" id="password" name="password" class="w-full p-2 border rounded" required>
            </div>
            <div class="mb-4">
                <label for="confirm_password" class="block text-gray-700">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="w-full p-2 border rounded" required>
            </div>
            <div class="mb-4">
                <label for="phone" class="block text-gray-700">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="w-full p-2 border rounded" required>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 animate__animated animate__pulse animate__infinite">Register</button>
        </form>
        <p class="text-center mt-4">Already have an account? <a href="{{ url_for('login') }}" class="text-blue-500 hover:underline">Login</a></p>
    </section>
    <script>
        function validateRegisterForm() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const phone = document.getElementById('phone').value;
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');

            // Reset error alert
            errorAlert.classList.add('hidden');
            errorMessage.textContent = '';

            // Validation rules
            const nameRegex = /^[a-zA-Z\s]{2,}$/;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const usernameRegex = /^[a-zA-Z0-9]{3,20}$/;
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            const phoneRegex = /^\d{10}$/;

            if (!nameRegex.test(name)) {
                errorMessage.textContent = 'Name must be at least 2 characters long and contain only letters and spaces.';
                errorAlert.classList.remove('hidden');
                return false;
            }
            if (!emailRegex.test(email)) {
                errorMessage.textContent = 'Please enter a valid email address.';
                errorAlert.classList.remove('hidden');
                return false;
            }
            if (!usernameRegex.test(username)) {
                errorMessage.textContent = 'Username must be 3-20 characters long and alphanumeric.';
                errorAlert.classList.remove('hidden');
                return false;
            }
            if (!passwordRegex.test(password)) {
                errorMessage.textContent = 'Password must be at least 8 characters long, with one uppercase, one lowercase, one number, and one special character.';
                errorAlert.classList.remove('hidden');
                return false;
            }
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match.';
                errorAlert.classList.remove('hidden');
                return false;
            }
            if (!phoneRegex.test(phone)) {
                errorMessage.textContent = 'Phone number must be exactly 10 digits.';
                errorAlert.classList.remove('hidden');
                return false;
            }
            return true;
        }
    </script>
{% endblock %}
